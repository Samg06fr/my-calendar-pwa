services:
  - type: web
    name: my-calendar-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:scgoldhaber@gmail.com
      - key: DB_PATH
        value: ./data/calendar.db
      - key: CORS_ORIGIN
        sync: false
